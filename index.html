<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steady bubbles</title>
<meta name="description" content="Computations of steady bubbles in an inviscid stream.">
<style>
  :root { --bg: #faf8f3; --ink: #24292e; --muted: #6a737d; --link: #0366d6; --rule: #e4e1d8; }
  html, body { background-color: var(--bg); margin: 0; }
  body {
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 18vh 24px 48px; }
  h1 { font-size: 2.4rem; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 1.6rem; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  li { border-bottom: 1px solid var(--rule); padding: 0.9rem 0; font-size: 1.25rem; }
  a { color: var(--link); text-decoration: none; }
  a:hover, a:focus-visible { text-decoration: underline; }
  .soon { color: var(--muted); }
  .soon span { font-size: 0.95rem; }
  footer { margin-top: 3rem; font-size: 0.9rem; color: var(--muted); }
  footer a { color: var(--muted); text-decoration: underline; }
  @media (max-width: 480px) { h1 { font-size: 2rem; } li { font-size: 1.1rem; } }
</style>
</head>
<body>
<main>
  <h1>Steady bubbles</h1>
  <ul>
    <li><a href="axisymmetric/">Axisymmetric</a></li>
    <li class="soon">Leonardo da Vinci’s paradox <span>(coming soon)</span></li>
  </ul>
  <footer><a href="https://lukasniebel.github.io/">Lukas Niebel</a></footer>
</main>
</body>
</html>
